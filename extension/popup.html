<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #cbd5e1;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-b: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #6366f1, #fbbf24);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background-color: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      color: #f1f5f9;
      font-size: 12px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    button {
      width: 100%;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #4338ca;
    }
    .success-msg {
      display: none;
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      text-align: center;
      margin-top: 12px;
    }
    .loader {
      display: none;
      text-align: center;
      font-size: 11px;
      color: #fbbf24;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo"></div>
    <div class="title">NovaMind — Akıllı Kaydedici</div>
  </div>

  <div id="loader" class="loader">Sayfa bilgileri çekiliyor...</div>

  <div class="form-group">
    <label>Başlık</label>
    <input type="text" id="page-title">
  </div>

  <div class="form-group">
    <label>Notunuz (AI analizini yönlendirir)</label>
    <textarea id="page-note" rows="3" placeholder="Bu sayfadan ne öğrenmek istiyorsunuz?"></textarea>
  </div>

  <button id="save-btn">NovaMind'a Kaydet</button>

  <div id="success" class="success-msg">✓ Başarıyla Fikir Defterine Kaydedildi!</div>

  <script src="popup.js"></script>
</body>
</html>
